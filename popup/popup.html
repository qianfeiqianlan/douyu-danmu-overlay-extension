<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Douyu Danmu Overlay</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <div class="title">Douyu Danmu Overlay</div>
      <label class="toggle-row">
        <span class="toggle-text">
          <span class="toggle-title">Show danmu overlay</span>
          <span class="toggle-status" id="statusText">Off</span>
        </span>
        <input id="enabledToggle" type="checkbox" aria-label="Show danmu overlay">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
